# otto.alfaoz.dev on justtype-vps: the website, the downloads and the update feed, all static files from
# /var/www/otto.alfaoz.dev (site/deploy.sh puts them there). certbot adds the https parts to this block.
server {
    include snippets/block-dotfiles.conf;
    listen 80;
    listen [::]:80;
    server_name otto.alfaoz.dev;
    root /var/www/otto.alfaoz.dev;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    location = /terms { return 301 /privacy#terms; }
    # the extension's Chrome Web Store listing
    location = /extension { return 302 https://chromewebstore.google.com/detail/paeiedncdfmlcnnaaibflehbffpbnbpi; }
    # what otto checks for updates, and the latest version's link: never from a cache
    location = /appcast.xml { expires -1; }
    location = /download/otto.dmg { expires -1; }
    location /download/ { expires 7d; }
    location ~ ^/(fonts|img)/ { expires 30d; }
}
